<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>東バス山 | アイコンデザイン</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f0f7f2; color: #244a36; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif; }
        main { max-width: 560px; padding: 40px 22px; margin: auto; text-align: center; }
        h1 { margin: 20px 0 6px; font-size: 1.65rem; }
        p { color: #617568; line-height: 1.6; }
        .main-icon { display: block; width: 224px; height: 224px; border-radius: 48px; margin: 30px auto 0; box-shadow: 0 12px 35px #244a3626; }
        .sizes { display: flex; align-items: end; justify-content: center; gap: 40px; margin: 28px 0; }
        .sizes img { display: block; width: 72px; height: 72px; border-radius: 16px; margin: auto; }
        .sizes div:first-child img { width: 40px; height: 40px; border-radius: 9px; }
        a { color: #16784c; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <img class="main-icon" src="icon.svg?v=110" alt="東とバスと山を組み合わせた東バス山のアイコン">
        <h1>東バス山</h1>
        <p>「東 ＋ バス ＋ 山」で、東松山をもじった「東バス山」。<br>文字あそびが伝わるグリーンのアイコン。</p>
        <div class="sizes">
            <div><img src="icon-192.png?v=110" alt="40ピクセルでの見え方"><p>小さな表示</p></div>
            <div><img src="icon-512.png?v=110" alt="72ピクセルでの見え方"><p>ホーム画面</p></div>
        </div>
        <a href="./">アプリに戻る</a>
    </main>
</body>
</html>
